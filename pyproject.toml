[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "power-quality-lab"
version = "0.1.0"
description = "A standard-library AC power-quality analysis and fault-classification lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mina Soliman" }]

[project.optional-dependencies]
dev = ["ruff>=0.16.0,<1.0"]

[project.scripts]
power-quality = "power_quality_lab.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
